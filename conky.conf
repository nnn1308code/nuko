conky.config = {
    background = true,
    update_interval = 4,

    double_buffer = true,
    no_buffers = true,

-- #######################################################
    -- ======= 半透明化 ＆ アプリの邪魔をしないウィンドウ設定 =======
    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_argb_visual = true,
--    own_window_argb_value = 35,
--    own_window_argb_value = 0,
    own_window_argb_value = 8,
    own_window_colour = 'black',
--    own_window_hints = 'undecorated,above,sticky,skip_taskbar,skip_pager', 
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    own_window_mouse_events = false, 
-- #######################################################

    alignment = 'top_right',

--    gap_x = 100,
    gap_x = 0,
    gap_y = 40,

    -- ======= ウィンドウ自体の横幅を縮小 =======
    minimum_width = 180,
    maximum_width = 180,

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,

    use_xft = true,
    font = 'Meiryo UI:size=9',

    default_color = 'white',
    color1 = 'cyan',
    color2 = 'green',
    color3 = 'yellow',
    color4 = 'red',

    cpu_avg_samples = 2,
    net_avg_samples = 2,
};


-- ${color1}${font DejaVu Sans Mono:bold:size=12}SYSTEM MONITOR${font}${color}
-- ${hr 2}

conky.text = [[
${color1}CPU${color} ${cpu}%  ${cpubar 8,60} ${if_match ${cpu cpu0} < 10}${font Noto Color Emoji:size=10}😊${font Meiryo UI:size=9} (快適) \
${else}${if_match ${cpu cpu0} < 35}${font Noto Color Emoji:size=10}🙂${font Meiryo UI:size=9} (普通) \
${else}${if_match ${cpu cpu0} < 60}${font Noto Color Emoji:size=10}😰${font Meiryo UI:size=9} (やや重) \
${else}${if_match ${cpu cpu0} < 85}${font Noto Color Emoji:size=10}😡${font Meiryo UI:size=9} (高負荷) \
${else}${font Noto Color Emoji:size=10}🥶${font Meiryo UI:size=9} (限界!)${endif}${endif}${endif}${endif}
${cpugraph 40,180 000000 00ffff}
Freq  : ${freq} MHz
${font Noto Color Emoji:size=8}⚡${font Meiryo UI:size=9}CpuGovernor:${execi 5 cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor}
${font Noto Color Emoji:size=8}⚡${font Meiryo UI:size=9}CpuEPP:${execi 5 cat /sys/devices/system/cpu/cpu0/cpufreq/energy_performance_preference}
マザーボード (PCH):  ${hwmon 6 temp 1}°C
CPU (Pkg):     ${hwmon 5 temp 1}°C
SSD (NVMe): ${hwmon 3 temp 1}°C

${color1}RAM${color}     ${mem} / ${memmax}
使用率  ${memperc}%  ${membar 8,100}
${memgraph 40,180 000000 00ff00}

${color1}DISK${color}
Root     ${fs_used /} / ${fs_size /}
         ${fs_used_perc /}% ${fs_bar 8,100 /}

${color1}NETWORK${color}
eno2 Download ${downspeed eno2} /s
     Upload   ${upspeed eno2} /s
wlo1 Download ${downspeed wlo1} /s
     Upload   ${upspeed wlo1} /s

${color1}TOP CPU${color}
${top name 1} ${top cpu 1}%
${top name 2} ${top cpu 2}%
${top name 3} ${top cpu 3}%
${top name 4} ${top cpu 4}%

${color1}TOP RAM${color}
${top_mem name 1} ${top_mem mem 1}%
${top_mem name 2} ${top_mem mem 2}%
${top_mem name 3} ${top_mem mem 3}%
${top_mem name 4} ${top_mem mem 4}%

${color1}Load1${color}:         ${loadavg 1}
${color1}PROCESSES${color}  Total: ${processes}
${color1}UPTIME${color}:      ${uptime}

]]

